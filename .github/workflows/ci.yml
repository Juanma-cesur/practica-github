name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Añadir feature al README
        run: |
          echo "Añadida feature" >> README.md

      - name: Mostrar README
        run: cat README.md

  validate-dev:
    needs: update-readme

    runs-on: self-hosted

    steps:
      - name: Validar DEV
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden"
          } else {
            Write-Host "No coinciden"
            exit 1
          }