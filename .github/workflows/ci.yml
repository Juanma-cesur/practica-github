name: CI

on:
    push:
        branches:
            - develop

    pull_request:
      branches:
        - develop
      types:
        - opened
        - synchronize
        - reopened

    workflow_dispatch:

jobs:

    update-readme:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Añadir feature al README
          run: |
            echo "Añadida feature: $GITHUB_HEAD_REF$GITHUB_REF_NAME" >> README.md

        - name: Mostrar contenido README
          run: cat README.md

    validate-dev:
      runs-on: self-hosted

      needs: update-readme

      steps:
        - name: Validar DEV_TOKEN
          shell: powershell
          env:
            DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          run: |
            if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
              Write-Host "DEV_TOKEN y LOCAL_DEV_TOKEN coinciden"
            }
            else {
              Write-Host "DEV_TOKEN y LOCAL_DEV_TOKEN NO coinciden"
              exit 1
            }