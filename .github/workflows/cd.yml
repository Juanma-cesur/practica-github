name: CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Actualizar versión
        run: |
          echo "AppVersion-1" >> README.md

  validate-prod:
    needs: update-readme

    runs-on: self-hosted

    steps:
      - name: Validar PROD
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Coinciden"
          } else {
            Write-Host "No coinciden"
            exit 1
          }