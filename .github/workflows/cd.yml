name: CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:

  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Incrementar versión
        run: |
          echo "AppVersion-$(date +%s) - $(date)" >> README.md

      - name: Mostrar contenido README
        run: cat README.md

  validate-prod:
    runs-on: self-hosted

    needs: update-readme

    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN y LOCAL_PROD_TOKEN coinciden"
          }
          else {
            Write-Host "PROD_TOKEN y LOCAL_PROD_TOKEN NO coinciden"
            exit 1
          }