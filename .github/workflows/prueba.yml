name: Comparar Token DEV

on:
  push:

jobs:
  comprobar-token:
    runs-on: self-hosted

    steps:
      - name: Comparar secret y variable local
        shell: push
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN y LOCAL_DEV_TOKEN coinciden"
          }
          else {
            Write-Host "DEV_TOKEN y LOCAL_DEV_TOKEN no coinciden"
          }